<!DOCTYPE html>
<!-- lang="es": el lector de pantalla y la síntesis de voz usan la pronunciación española. -->
<html lang="es" data-tema="estandar" data-texto="normal">
<head>
  <meta charset="utf-8">
  <!-- No se bloquea el zoom (sin user-scalable=no): Lucía amplía al 200 %. -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Football Vibration</title>
  <!-- Icono vacío: evita una petición fallida a favicon.ico. -->
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <a class="saltar" href="#principal">Saltar al contenido</a>

  <div class="marco">
    <!-- ===== LA APP ===== -->
    <div class="app" id="app">
      <!-- Barra fija: «Volver» siempre a la izquierda y «Estado» siempre a la derecha (R9.2.3). -->
      <header class="barra">
        <button type="button" id="btn-volver" class="btn-barra">
          <span aria-hidden="true">←</span> Volver
        </button>
        <!-- Marca de la app. Decorativa (aria-hidden): solo se ve en las pantallas sin «Volver»,
             en el hueco que ese botón deja libre. No es interactiva ni cambia la posición de los botones. -->
        <span class="marca" aria-hidden="true"><svg viewBox="0 0 48 48" focusable="false"><circle cx="24" cy="24" r="8"/><path d="M12 15a13 13 0 0 0 0 18M36 15a13 13 0 0 1 0 18M5 9a22 22 0 0 0 0 30M43 9a22 22 0 0 1 0 30"/></svg><span>Football<br>Vibration</span></span>
        <!-- El nombre accesible incluye el texto visible «Estado» (WCAG 2.5.3). -->
        <button type="button" id="btn-estado" class="btn-barra" aria-label="Estado del sistema">
          Estado <span aria-hidden="true">ⓘ</span>
        </button>
      </header>

      <!-- Cada pantalla se pinta aquí, con un único h1. tabindex="-1" permite el enlace «Saltar al contenido». -->
      <main id="principal" tabindex="-1"></main>

      <!-- Aviso de conexión (P14). Es un bloque dentro de la app, no una pantalla:
           no saca al usuario del partido ni le mueve el foco (D-11).
           Va DESPUÉS de la pantalla: si estuviera encima, al aparecer empujaría los controles
           rápidos y dejarían de estar «siempre en el mismo sitio» (R9.2.2, Iteración 2).
           role="alert" equivale a aria-live="assertive": solo se usa para fallos. -->
      <section id="aviso-conexion" class="aviso-conexion" aria-label="Aviso de conexión" hidden>
        <p id="aviso-texto" role="alert"></p>
        <div id="aviso-botones" class="pila"></div>
      </section>

      <!-- Subtítulos de la narración: texto visible de lo que dice la voz.
           NO es región viva: si lo fuera, el lector de pantalla repetiría lo que ya dice la narración. -->
      <p id="subtitulo" class="subtitulo" hidden></p>

      <!-- Confirmaciones de la interfaz. aria-live="polite": se leen sin interrumpir. -->
      <div id="avisos" class="avisos" role="status" aria-live="polite"></div>
    </div>

    <!-- ===== SIMULADOR (herramienta de prueba, no forma parte del producto) ===== -->
    <!-- Plegado por defecto y con aspecto discreto: es para el equipo de desarrollo, no para el usuario.
         Sigue siendo accesible con teclado y lector de pantalla (un único control al final de la página). -->
    <aside class="simulador" aria-labelledby="sim-titulo">
      <details id="sim-panel">
        <summary><h2 id="sim-titulo">Herramientas de prueba <span class="sim-para">(equipo de desarrollo)</span></h2></summary>
        <div id="sim-contenido"></div>
      </details>
    </aside>
  </div>

  <!-- Diálogo de confirmación. <dialog> nativo: atrapa el foco, se cierra con Escape
       y devuelve el foco al botón que lo abrió. -->
  <dialog id="dialogo" aria-labelledby="dialogo-titulo" aria-describedby="dialogo-texto">
    <h2 id="dialogo-titulo"></h2>
    <p id="dialogo-texto"></p>
    <div id="dialogo-botones" class="pila"></div>
  </dialog>

  <noscript><p class="sin-js">Esta app necesita JavaScript para funcionar.</p></noscript>

  <!-- Scripts clásicos (sin módulos) para que funcione abriendo index.html directamente. -->
  <script src="js/datos-respaldo.js"></script>
  <script src="js/almacen.js"></script>
  <script src="js/patrones.js"></script>
  <script src="js/voz.js"></script>
  <script src="js/app.js"></script>
  <script src="js/partido.js"></script>
  <script src="js/simulador.js"></script>
  <script src="js/pantallas-perfil.js"></script>
  <script src="js/pantallas-accesorio.js"></script>
  <script src="js/pantallas-partido.js"></script>
</body>
</html>
